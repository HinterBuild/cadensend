
services:
  postgres:
    image: postgres:15
    container_name: cadensend-postgres
    environment:
      POSTGRES_DB: cadensend
      POSTGRES_USER: cadensend
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadensend}
      MIGRATIONS_DIR: /migrations
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/migrations:ro
      - ./db/run-migrations.sh:/docker-entrypoint-initdb.d/10-run-migrations.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadensend || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: cadensend-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: cadensend-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: cadensend-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend-api:
    build: ./backend/control-api
    container_name: cadensend-backend-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://cadensend:${POSTGRES_PASSWORD:-cadensend}@postgres:5432/cadensend?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      OBJECT_STORAGE_URL: http://minio:9000
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      EMAIL_PROVIDER: "${EMAIL_PROVIDER}"
      SMTP_FROM: "${SMTP_FROM}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME}"
      BREVO_API_KEY: "${BREVO_API_KEY}"
      BREVO_API_URL: "${BREVO_API_URL}"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-in-production}"
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:-dev-internal-token-change-in-production}"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:3000}"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:-}"
      AI_API_URL: http://ai-engine-api:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend-worker:
    build: ./backend/control-worker
    container_name: cadensend-backend-worker
    environment:
      DATABASE_URL: postgres://cadensend:${POSTGRES_PASSWORD:-cadensend}@postgres:5432/cadensend?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      OBJECT_STORAGE_URL: http://minio:9000
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      EMAIL_PROVIDER: "${EMAIL_PROVIDER}"
      SMTP_FROM: "${SMTP_FROM}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME}"
      BREVO_API_KEY: "${BREVO_API_KEY}"
      BREVO_API_URL: "${BREVO_API_URL}"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-in-production}"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:3000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ai-engine-api:
    build: ./ai-service/ai-engine/api
    container_name: cadensend-ai-engine-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://cadensend:${POSTGRES_PASSWORD:-cadensend}@postgres:5432/cadensend
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      OBJECT_STORAGE_URL: http://minio:9000
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      DEFAULT_MODEL: "${DEFAULT_MODEL:-poolside/laguna-s-2.1:free}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-nvidia/nemotron-3-embed-1b:free}"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-in-production}"
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:-dev-internal-token-change-in-production}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ai-engine-worker:
    build:
      context: ./ai-service/ai-engine
      dockerfile: workers/Dockerfile
    container_name: cadensend-ai-engine-worker
    environment:
      PYTHONPATH: /app/api
      DATABASE_URL: postgresql+asyncpg://cadensend:${POSTGRES_PASSWORD:-cadensend}@postgres:5432/cadensend
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      OBJECT_STORAGE_URL: http://minio:9000
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      DEFAULT_MODEL: "${DEFAULT_MODEL:-poolside/laguna-s-2.1:free}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-nvidia/nemotron-3-embed-1b:free}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      ai-engine-api:
        condition: service_started

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      BACKEND_API_URL: http://backend-api:8080
      AI_API_URL: http://ai-engine-api:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend/web:/app
      - frontend_nm_tw4:/app/node_modules
    working_dir: /app
    command: ["npm", "run", "dev"]
    depends_on:
      backend-api:
        condition: service_started
      ai-engine-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  frontend_nm_tw4:
