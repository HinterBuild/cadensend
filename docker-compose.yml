
services:
  postgres:
    image: postgres:15
    container_name: cadensend-postgres
    environment:
      POSTGRES_DB: cadensend
      POSTGRES_USER: cadensend
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadensend}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations-docker:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadensend || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: cadensend-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: cadensend-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: cadensend-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend-api:
    build: ./backend/control-api
    container_name: cadensend-backend-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgres://cadensend:cadensend@localhost:5432/cadensend?sslmode=disable}"
      REDIS_URL: "redis://redis:6379/0"
      QDRANT_URL: "http://qdrant:6333"
      OBJECT_STORAGE_URL: "http://minio:9000"
      EMAIL_PROVIDER: "brevo"
      BREVO_API_KEY: "${BREVO_API_KEY:-}"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-in-production}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  backend-worker:
    build: ./backend/control-worker
    container_name: cadensend-backend-worker
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgres://cadensend:cadensend@localhost:5432/cadensend?sslmode=disable}"
      REDIS_URL: "redis://redis:6379/0"
      QDRANT_URL: "http://qdrant:6333"
      OBJECT_STORAGE_URL: "http://minio:9000"
      EMAIL_PROVIDER: "brevo"
      BREVO_API_KEY: "${BREVO_API_KEY:-}"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-in-production}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  ai-engine-api:
    build: ./ai-service/ai-engine/api
    container_name: cadensend-ai-engine-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://cadensend:cadensend@localhost:5432/cadensend}"
      REDIS_URL: "redis://redis:6379/0"
      QDRANT_URL: "http://qdrant:6333"
      OBJECT_STORAGE_URL: "http://minio:9000"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      DEFAULT_MODEL: "${DEFAULT_MODEL:-poolside/laguna-s-2.1:free}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-nvidia/nemotron-3-embed-1b:free}"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-in-production}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  ai-engine-worker:
    build:
      context: ./ai-service/ai-engine
      dockerfile: workers/Dockerfile
    container_name: cadensend-ai-engine-worker
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://cadensend:cadensend@localhost:5432/cadensend}"
      REDIS_URL: "redis://redis:6379/0"
      QDRANT_URL: "http://qdrant:6333"
      OBJECT_STORAGE_URL: "http://minio:9000"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      DEFAULT_MODEL: "${DEFAULT_MODEL:-poolside/laguna-s-2.1:free}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-nvidia/nemotron-3-embed-1b:free}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ai-engine-api:
        condition: service_started

  frontend:
    build: ./frontend/web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
      NEXT_PUBLIC_AI_API_URL: "http://localhost:8000"
    depends_on:
      backend-api:
        condition: service_started
      ai-engine-api:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
