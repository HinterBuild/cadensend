version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: cadensend-postgres
    environment:
      POSTGRES_DB: cadensend
      POSTGRES_USER: cadensend
      POSTGRES_PASSWORD: cadensend
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["cmd", "pg_isready", "-U", "cadensend"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: cadensend-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["cmd", "curl", "-f", "http://localhost:6333/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cadensend-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: cadensend-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend-api:
    build: ./backend/control-api
    container_name: cadensend-backend-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://cadensend:cadensend@postgres:5432/cadensend?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      QDRANT_URL: "http://qdrant:6333"
      OBJECT_STORAGE_URL: "http://minio:9000"
      EMAIL_PROVIDER: "sendgrid"
      SENDGRID_API_KEY: ""
      JWT_SECRET: "dev-secret-key-change-in-production"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  backend-worker:
    build: ./backend/control-worker
    container_name: cadensend-backend-worker
    environment:
      DATABASE_URL: "postgres://cadensend:cadensend@postgres:5432/cadensend?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      QDRANT_URL: "http://qdrant:6333"
      OBJECT_STORAGE_URL: "http://minio:9000"
      EMAIL_PROVIDER: "sendgrid"
      SENDGRID_API_KEY: ""
      JWT_SECRET: "dev-secret-key-change-in-production"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  ai-engine-api:
    build: ./ai-service/ai-engine/api
    container_name: cadensend-ai-engine-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://cadensend:cadensend@postgres:5432/cadensend"
      REDIS_URL: "redis://redis:6379/0"
      QDRANT_URL: "http://qdrant:6333"
      OBJECT_STORAGE_URL: "http://minio:9000"
      OPENROUTER_API_KEY: "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"
      DEFAULT_MODEL: "nvidia/nemotron-3-embed-1b:free"
      JWT_SECRET: "dev-secret-key-change-in-production"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  ai-engine-worker:
    build: ./ai-service/ai-engine
    container_name: cadensend-ai-engine-worker
    environment:
      DATABASE_URL: "postgresql+asyncpg://cadensend:cadensend@postgres:5432/cadensend"
      REDIS_URL: "redis://redis:6379/0"
      QDRANT_URL: "http://qdrant:6333"
      OBJECT_STORAGE_URL: "http://minio:9000"
      OPENROUTER_API_KEY: "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"
      DEFAULT_MODEL: "nvidia/nemotron-3-embed-1b:free"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ai-engine-api:
        condition: service_started

  frontend:
    build: ./frontend/web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
      NEXT_PUBLIC_AI_API_URL: "http://localhost:8000"
    depends_on:
      backend-api:
        condition: service_started
      ai-engine-api:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
