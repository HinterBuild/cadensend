version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: cadensend-postgres
    environment:
      POSTGRES_DB: cadensend
      POSTGRES_USER: cadensend
      POSTGRES_PASSWORD: cadensend
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["cmd", "pg_isready", "-U", "cadensend"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: cadensend-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT_API_KEY: ""
    healthcheck:
      test: ["cmd", "curl", "-f", "http://localhost:6333/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: cadensend-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  go-api:
    build: ./services/control-api
    container_name: cadensend-go-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://cadensend:cadensend@postgres:5432/cadensend?sslmode=disable"
      QDRANT_URL: "http://qdrant:6333"
      OBJECT_STORAGE_URL: "http://minio:9000"
      EMAIL_PROVIDER: "sendgrid"
      SENDGRID_API_KEY: ""
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy

  go-worker:
    build: ./services/control-worker
    container_name: cadensend-go-worker
    environment:
      DATABASE_URL: "postgres://cadensend:cadensend@postgres:5432/cadensend?sslmode=disable"
      QDRANT_URL: "http://qdrant:6333"
      OBJECT_STORAGE_URL: "http://minio:9000"
      EMAIL_PROVIDER: "sendgrid"
      SENDGRID_API_KEY: ""
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy

  python-api:
    build: ./services/ai-engine/api
    container_name: cadensend-python-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgres://cadensend:cadensend@postgres:5432/cadensend?sslmode=disable"
      QDRANT_URL: "http://qdrant:6333"
      OBJECT_STORAGE_URL: "http://minio:9000"
      OPENROUTER_API_KEY: "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"
      DEFAULT_MODEL: "nvidia/nemotron-3-embed-1b:free"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy

  python-worker:
    build: ./services/ai-engine/workers
    container_name: cadensend-python-worker
    environment:
      DATABASE_URL: "postgres://cadensend:cadensend@postgres:5432/cadensend?sslmode=disable"
      QDRANT_URL: "http://qdrant:6333"
      OBJECT_STORAGE_URL: "http://minio:9000"
      OPENROUTER_API_KEY: "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"
      DEFAULT_MODEL: "nvidia/nemotron-3-embed-1b:free"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build: ./apps/web
    container_name: cadensend-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
      NEXT_PUBLIC_AI_API_URL: "http://localhost:8000"
    depends_on:
      go-api:
        condition: service_started
      python-api:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
