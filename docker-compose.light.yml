services:
  postgres:
    image: postgres:15
    container_name: cadensend-postgres
    environment:
      POSTGRES_DB: cadensend
      POSTGRES_USER: ${POSTGRES_USER:-cadensend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadensend}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/migrations-docker:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cadensend} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: cadensend-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: cadensend-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: cadensend-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  cadensend:
    build:
      context: .
      dockerfile: Dockerfile.cadensend
    container_name: cadensend-app
    image: cadensend/cadensend:latest
    ports:
      - "3000:3000"
      - "8080:8080"
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-cadensend}:${POSTGRES_PASSWORD:-cadensend}@postgres:5432/cadensend?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - DEFAULT_MODEL=poolside/laguna-s-2.1:free
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - EMAIL_PROVIDER=brevo
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - DEBUG=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

volumes:
  pg_data:
  qdrant_data:
  minio_data:
