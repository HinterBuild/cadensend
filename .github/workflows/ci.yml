name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      # Go linting
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
          
      - name: Go vet
        working-directory: services/control-api
        run: go vet ./...
        
      - name: Go vet (worker)
        working-directory: services/control-worker
        run: go vet ./...
      
      # Python linting
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Python lint
        working-directory: services/ai-engine/api
        run: |
          pip install ruff
          ruff check .
      
      # Frontend linting
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package.json
          
      - name: Frontend lint
        working-directory: apps/web
        run: npm run lint

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: cadensend
          POSTGRES_USER: cadensend
          POSTGRES_PASSWORD: cadensend
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      
      # Setup Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          
      - name: Run Go tests
        working-directory: services/control-api
        run: go test ./...
        
      - name: Run Go worker tests
        working-directory: services/control-worker
        run: go test ./...
      
      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Python dependencies
        working-directory: services/ai-engine/api
        run: pip install -r requirements.txt
        
      - name: Run Python tests
        working-directory: services/ai-engine/api
        run: python -m pytest tests/ || echo "No tests found"
      
      # Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        working-directory: apps/web
        run: npm install
        
      - name: Run frontend tests
        working-directory: apps/web
        run: npm test -- --passWithNoTests || echo "No tests found"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          
      - name: Build Go API
        working-directory: services/control-api
        run: go build -o /tmp/control-api ./cmd/server
        
      - name: Build Go Worker
        working-directory: services/control-worker
        run: go build -o /tmp/control-worker ./cmd/server
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Python dependencies
        working-directory: services/ai-engine/api
        run: pip install -r requirements.txt
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Build frontend
        working-directory: apps/web
        run: |
          npm install
          npm run build

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: echo "Deploy to staging environment"
