
services:
  postgres:
    image: postgres:15
    container_name: cadensend-postgres-dev
    environment:
      POSTGRES_DB: cadensend
      POSTGRES_USER: ${POSTGRES_USER:-cadensend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadensend}
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
      - ./db/migrations-docker:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cadensend} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: cadensend-qdrant-dev
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data_dev:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: cadensend-redis-dev
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: cadensend-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data_dev:/data

  control-api:
    build:
      context: ./backend/control-api
      dockerfile: Dockerfile.dev
    container_name: cadensend-control-api-dev
    command: air
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://cadensend:cadensend@postgres:5432/cadensend?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - ./backend/control-api:/src
    working_dir: /src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      minio:
        condition: service_started

  control-worker:
    build:
      context: ./backend/control-worker
      dockerfile: Dockerfile.dev
    container_name: cadensend-control-worker-dev
    command: air
    environment:
      - DATABASE_URL=postgres://cadensend:cadensend@postgres:5432/cadensend?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./backend/control-worker:/src
    working_dir: /src
    depends_on:
      - control-api

  ai-engine:
    build:
      context: ./ai-service/ai-engine
      dockerfile: api/Dockerfile.dev
    container_name: cadensend-ai-engine-dev
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/ai-engine
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://cadensend:cadensend@postgres:5432/cadensend
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - MINIO_ENDPOINT=minio:9000
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - DEFAULT_MODEL=poolside/laguna-s-2.1:free
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
    volumes:
      - ./ai-service/ai-engine:/app/ai-engine
    depends_on:
      control-api:
        condition: service_started
      postgres:
        condition: service_healthy

  ai-worker:
    build:
      context: ./ai-service/ai-engine
      dockerfile: workers/Dockerfile.dev
    container_name: cadensend-ai-worker-dev
    command: python workers/main.py
    environment:
      - DATABASE_URL=postgres://cadensend:cadensend@postgres:5432/cadensend
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - MINIO_ENDPOINT=minio:9000
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - DEFAULT_MODEL=poolside/laguna-s-2.1:free
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
    volumes:
      - ./ai-service/ai-engine:/app/ai-engine
    depends_on:
      - ai-engine

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile.dev
    container_name: cadensend-frontend-dev
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://control-api:8080
      - NEXT_PUBLIC_AI_API_URL=http://ai-engine:8000
    volumes:
      - ./frontend/web:/app
      - /app/node_modules
    depends_on:
      - control-api
      - ai-engine

volumes:
  pg_data_dev:
  qdrant_data_dev:
  minio_data_dev:
