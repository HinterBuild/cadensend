global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'cadensend-control-api'
    static_configs:
      - targets: ['go-api:8080']
    metrics_path: '/metrics'

  - job_name: 'cadensend-control-worker'
    static_configs:
      - targets: ['go-worker:8081']
    metrics_path: '/metrics'

  - job_name: 'cadensend-ai-engine'
    static_configs:
      - targets: ['python-api:8000']
    metrics_path: '/metrics'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']
