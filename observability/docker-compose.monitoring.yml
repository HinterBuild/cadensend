version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: cadensend-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/consoles'
      - '--web.console.templates=/etc/prometheus/templates'
    depends_on:
      - go-api
      - python-api
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana-enterprise:latest
    container_name: cadensend-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-monitoring-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    profiles: ["monitoring"]

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: cadensend-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      COLLECTOR_OTLP_ENABLED: true
    profiles: ["monitoring"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: cadensend-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    profiles: ["monitoring"]

  loki:
    image: grafana/loki:latest
    container_name: cadensend-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
    profiles: ["monitoring"]

  promtail:
    image: grafana/promtail:latest
    container_name: cadensend-promtail
    volumes:
      - /var/log:/var/log:ro
      - /proc:/proc:ro
      - ./promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    profiles: ["monitoring"]

volumes:
  grafana_data:
